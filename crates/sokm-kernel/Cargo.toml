[package]
name = "sokm-kernel"
description = "SOKM kernel unit layer: activation, one-pass growth, STM, KernelGraph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["machine-learning", "self-organizing", "kernel", "memory", "cognitive"]
categories = ["algorithms", "science"]
exclude = [".github/", "tests/", "docs/"]

[dependencies]
thiserror = { workspace = true }
sokm = { workspace = true }
serde = { workspace = true, optional = true }
rmp-serde = { workspace = true, optional = true }
wide = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
sokm = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }

[features]
default = []
serde = ["dep:serde", "dep:rmp-serde", "sokm/serde"]
simd = ["dep:wide"]

[[bench]]
name = "kernel"
harness = false
