name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Test (serde feature)
        run: cargo test --workspace --features serde

      - name: Test (simd feature)
        run: cargo test -p sokm-kernel --features simd

      - name: Clippy (simd feature)
        run: cargo clippy --workspace --features simd -- -D warnings

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Licenses, bans, advisories
        run: cargo deny check
